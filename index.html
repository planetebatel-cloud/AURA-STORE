<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet modern store. Full-bleed campaign hero, edge-to-edge product grid, side drawers for product and bag. */
:root {
  --bg: #FFFFFF;
  --ink: #111111;
  --mute: #767674;
  --line: #E7E7E4;
  --tile: #ECEDEA;
  --scrim: rgba(17, 17, 17, 0.42);
  --brand: "Archivo", "Arial Black", Arial, sans-serif;
  --sans: "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.pad { padding-left: var(--gl); padding-right: var(--gr); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.price { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }

/* announcement + header */
.announce { background: var(--ink); color: var(--bg); text-align: center; font-size: 12.5px; letter-spacing: 0.02em; padding-block: 9px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.head-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; }
.nav { display: flex; gap: 22px; }
.nav a, .bag-btn { color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
.nav a:hover, .bag-btn:hover { text-decoration: underline; text-underline-offset: 4px; }
.mark { font-family: var(--brand); font-weight: 800; font-stretch: 125%; font-size: 22px; letter-spacing: 0.06em; color: var(--ink); text-decoration: none; }
.bag-btn { justify-self: end; background: none; border: 0; cursor: pointer; padding: 8px 0; }

/* hero */
.hero { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--tile); }
.hero-media { position: relative; aspect-ratio: 3 / 4; max-height: min(80vh, 860px); width: 100%; overflow: hidden; max-width: 100%; }
.hero-media img, .hero-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-copy {
  position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap;
  padding-block: 0 clamp(20px, 4vw, 48px);
}
.hero h1 { margin: 0; font-size: clamp(1.9rem, 4.4vw, 3.6rem); line-height: 1.02; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.hero p { margin: 6px 0 0; font-size: clamp(0.95rem, 1.3vw, 1.1rem); color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 28px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 0;
  font-size: 14px; font-weight: 600; letter-spacing: 0.03em; text-decoration: none; cursor: pointer;
}
.btn:hover { background: #2A2A2A; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }
.btn.wide { width: 100%; }
.btn[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }

/* shop grid */
.shop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: clamp(36px, 5vw, 64px) 18px; }
.shop-head h2 { margin: 0; font-size: 1.35rem; font-weight: 600; }
.shop-head span { color: var(--mute); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 10px; padding-block-end: clamp(48px, 7vw, 96px); }
.card { min-width: 0; display: grid; gap: 10px; align-content: start; cursor: pointer; }
.frame { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background: var(--tile); overflow: hidden; }
.frame img, .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.frame video { opacity: 0; transition: opacity 0.35s ease; }
.card.is-walking .frame video { opacity: 1; }
.badge { position: absolute; top: 10px; right: 10px; background: var(--bg); font-size: 11.5px; font-weight: 500; padding: 3px 8px; }
.card-meta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card-name { margin: 0; font-size: 14.5px; font-weight: 500; }
.card-sub { color: var(--mute); font-size: 13.5px; }
.card-price { font-size: 14.5px; font-weight: 500; white-space: nowrap; }
.card:focus-visible { outline-offset: 4px; }

/* about */
.about { border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px 48px; padding-block: clamp(40px, 6vw, 88px); }
.about p.big { margin: 0; font-size: clamp(1.4rem, 2.6vw, 2.2rem); line-height: 1.25; font-weight: 500; max-width: 22ch; text-wrap: balance; }
.about ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; align-self: end; }
.about li { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-block: 14px; }
.about li span:last-child { color: var(--mute); }

.foot { border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 22px 32px; color: var(--mute); font-size: 13.5px; }
.foot a { color: var(--ink); }
.foot .mark { font-size: 18px; }

/* drawers */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; animation: fade 0.2s ease; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 31; width: min(100%, 460px);
  background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slide 0.28s cubic-bezier(.2, .8, .2, 1);
}
@keyframes slide { from { transform: translateX(-36px); opacity: 0.5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.d-head { display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid var(--line); flex: none; }
.d-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.x { width: 40px; height: 40px; border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; }
.d-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-block: 16px 20px; }
.d-body > * { flex: none; }
.d-foot { flex: none; border-top: 1px solid var(--line); display: grid; gap: 12px; padding-block: 16px; }

.p-media { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 100%; background: var(--tile); overflow: hidden; }
.p-media img, .p-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.p-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.p-top h3 { margin: 0; font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.p-top .price { font-size: 1.15rem; font-weight: 500; }
.p-sub { margin: -12px 0 0; color: var(--mute); }
.p-desc { margin: 0; max-width: 46ch; }
.label { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; display: block; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sizes label { position: relative; }
.sizes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sizes span { display: grid; place-items: center; height: 46px; border: 1px solid var(--line); font-size: 14px; font-weight: 500; cursor: pointer; }
.sizes span:hover { border-color: var(--ink); }
.sizes input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.sizes input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.err { margin: 0; font-size: 13.5px; font-weight: 600; color: #B3261E; }
.details { list-style: none; margin: 0; padding: 0; }
.details li { border-top: 1px solid var(--line); padding-block: 11px; font-size: 14px; }
.note { margin: 0; font-size: 13px; color: var(--mute); }

.line { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; border-bottom: 1px solid var(--line); padding-block: 14px; }
.line .thumb { aspect-ratio: 3 / 4; background: var(--tile); overflow: hidden; }
.line .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.line-info { min-width: 0; display: grid; gap: 4px; align-content: start; }
.line-top { display: flex; justify-content: space-between; gap: 10px; }
.line-top b { font-weight: 500; }
.line-sub { color: var(--mute); font-size: 13.5px; }
.qty { display: flex; align-items: center; gap: 0; margin-top: 6px; }
.qty button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.qty output { width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
.qty .rm { width: auto; height: auto; background: none; border: 0; padding: 0; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; margin-inline-start: 14px; }
.empty { color: var(--mute); padding-block: 28px; margin: 0; }
.total { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
.field input { width: 100%; height: 46px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font: 500 15px var(--sans); color: var(--ink); border-radius: 0; }
.field input:focus-visible { outline: none; border-color: var(--ink); }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .nav { display: none; }
  .head-in { grid-template-columns: auto 1fr auto; }
  .head-in .mark { grid-column: 1; }
  .hero { grid-template-columns: 1fr; }
  .hero-media + .hero-media { display: none; }
  .hero-copy { color: var(--ink); }
  .about { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div dir="rtl" lang="he">
  <div class="announce pad" id="announce"></div>
  <header class="head">
    <div class="head-in pad">
      <nav class="nav" aria-label="ראשי">
        <a href="#shop">חנות</a>
        <a href="#about">עלינו</a>
      </nav>
      <a class="mark brand-name" href="#top" dir="ltr"></a>
      <button class="bag-btn" id="bag-open" type="button">סל (<span id="bag-count">0</span>)</button>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-label="קולקציה">
      <div class="hero-media" id="hero-a"></div>
      <div class="hero-media" id="hero-b"></div>
      <div class="hero-copy pad">
        <div>
          <h1 id="hero-title"></h1>
          <p id="hero-sub"></p>
        </div>
        <a class="btn" href="#shop">לקולקציה</a>
      </div>
    </section>

    <section id="shop" class="pad" aria-labelledby="shop-title">
      <div class="shop-head">
        <h2 id="shop-title">הקולקציה</h2>
        <span id="shop-count"></span>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="about" class="about pad" aria-label="עלינו">
      <p class="big" id="about-text"></p>
      <ul>
        <li><span>ייצור</span><span>ישראל</span></li>
        <li><span>שיטה</span><span>לפי הזמנה, בכמויות קטנות</span></li>
        <li><span>הזמנה</span><span>מוקדמת, אישור בוואטסאפ</span></li>
      </ul>
    </section>
  </main>

  <footer class="foot pad">
    <span class="mark brand-name" dir="ltr"></span>
    <span id="foot-links"></span>
    <span>© 2026</span>
  </footer>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="product" role="dialog" aria-modal="true" aria-labelledby="p-name" hidden>
    <div class="d-head pad"><h2>פרטי מוצר</h2><button class="x" type="button" data-close aria-label="סגירה">×</button></div>
    <div class="d-body pad">
      <div class="p-media" id="p-media"></div>
      <div class="p-top"><h3 id="p-name"></h3><span class="price" id="p-price" dir="ltr"></span></div>
      <p class="p-sub" id="p-color"></p>
      <p class="p-desc" id="p-desc"></p>
      <fieldset style="border:0;margin:0;padding:0">
        <legend class="label">מידה</legend>
        <div class="sizes" id="p-sizes"></div>
      </fieldset>
      <p class="err" id="p-err" hidden>בחרו מידה</p>
      <button class="btn wide" id="p-add" type="button">הוספה לסל</button>
      <ul class="details" id="p-details"></ul>
      <p class="note" id="p-note"></p>
    </div>
  </aside>

  <aside class="drawer" id="bag" role="dialog" aria-modal="true" aria-labelledby="bag-title" hidden>
    <div class="d-head pad"><h2 id="bag-title">סל קניות</h2><button class="x" type="button" data-close aria-label="סגירה">×</button></div>
    <div class="d-body pad" id="bag-lines"></div>
    <div class="d-foot pad" id="bag-foot">
      <div class="total"><span>סה״כ</span><span class="price" id="bag-total" dir="ltr"></span></div>
      <div class="field"><label class="label" for="o-name">שם להזמנה</label><input id="o-name" type="text" autocomplete="name"></div>
      <a class="btn wide" id="o-send" href="#" target="_blank" rel="noopener">להזמנה בוואטסאפ</a>
      <p class="err" id="o-err" hidden></p>
      <p class="note" id="o-note"></p>
    </div>
  </aside>
</div>

<script>
/* ===== НАСТРОЙКИ — меняешь только это ===== */
const CONFIG = {
  brand: "AURA",                 // название бренда (пока условное)
  whatsapp: "",                  // твой номер без +, например "972501234567". Пусто = кнопка заказа в режиме просмотра
  instagram: "",                 // ник без @, необязательно
  tiktok: "",                    // ник без @, необязательно
  announce: "הזמנה מוקדמת לקולקציה הראשונה · ייצור בישראל",
  heroTitle: "קולקציה ראשונה",
  heroSub: "מיוצר לפי הזמנה, בכמויות קטנות.",
  about: "בגדים שנתפרים בישראל, בכמויות קטנות. כל פריט נכנס לייצור רק אחרי שמזמינים אותו.",
  orderNote: "זו הזמנה מוקדמת. אחרי השליחה נחזור אליכם בוואטסאפ עם אישור, זמן אספקה ופרטי תשלום.",
  renderNote: "התמונות הן הדמיה. גוון הבד בפועל עשוי להיות שונה מעט.",
  sizes: ["S", "M", "L", "XL"],
  hero: ["hoodie", "bomber"],    // какие две вещи в шапке сайта
  items: [
    { id: "hoodie", name: "קפוצ'ון כבד",   color: "שחור", price: 249, poster: "media/hoodie.webp", video: "media/hoodie.mp4",
      desc: "קפוצ'ון אוברסייז מכותנה כבדה, כתפיים נפולות וכיס קנגורו.", details: ["גזרה אוברסייז", "כותנה כבדה", "נתפר בישראל"] },
    { id: "tee",    name: "טי בוקסי",      color: "לבן",  price: 129, poster: "media/tee.webp",    video: "media/tee.mp4",
      desc: "טישרט בגזרה בוקסית, צווארון צמוד ושרוול קצר רחב.", details: ["גזרה בוקסית", "כותנה", "נתפר בישראל"] },
    { id: "pants",  name: "מכנסיים רחבים", color: "זית",  price: 289, poster: "media/pants.webp",  video: "media/pants.mp4",
      desc: "מכנסיים בגזרה רחבה שנופלים על הנעל.", details: ["גזרה רחבה", "מותן גבוה", "נתפר בישראל"] },
    { id: "bomber", name: "בומבר קצר",     color: "ורוד", price: 389, poster: "media/bomber.webp", video: "media/bomber.mp4",
      desc: "בומבר קצר עם כתפיים נפולות וגומי במותן.", details: ["גזרה קצרה", "רוכסן מלא", "נתפר בישראל"] }
  ]
};
/* ========================================== */

(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const money = n => "₪" + n.toLocaleString("he-IL");
  const byId = id => CONFIG.items.find(i => i.id === id);
  const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const saveData = !!(navigator.connection && navigator.connection.saveData);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- static copy from config ---- */
  $$(".brand-name").forEach(el => el.textContent = CONFIG.brand);
  $("#announce").textContent = CONFIG.announce;
  $("#hero-title").textContent = CONFIG.heroTitle;
  $("#hero-sub").textContent = CONFIG.heroSub;
  $("#about-text").textContent = CONFIG.about;
  $("#shop-count").textContent = CONFIG.items.length + " פריטים";
  $("#o-note").textContent = CONFIG.orderNote;
  $("#p-note").textContent = CONFIG.renderNote;
  const links = [];
  if (CONFIG.instagram) links.push(`<a href="https://instagram.com/${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
  if (CONFIG.tiktok) links.push(`<a href="https://www.tiktok.com/@${esc(CONFIG.tiktok)}" target="_blank" rel="noopener">TikTok</a>`);
  $("#foot-links").innerHTML = links.join(" · ");
  document.title = CONFIG.brand;

  /* ---- hero: two looks walking ---- */
  CONFIG.hero.forEach((id, i) => {
    const it = byId(id), box = $(i ? "#hero-b" : "#hero-a");
    if (!it || !box) return;
    box.innerHTML = `<img src="${it.poster}" alt=""><video muted playsinline loop preload="${saveData ? "none" : "auto"}" aria-hidden="true" poster="${it.poster}"></video>`;
    const v = $("video", box);
    if (!reduce && !saveData) { v.src = it.video; v.autoplay = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  });

  /* ---- product grid ---- */
  const grid = $("#grid");
  const cards = CONFIG.items.map(it => {
    const el = document.createElement("article");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `${it.name}, ${it.color}, ${money(it.price)}`);
    el.innerHTML = `
      <div class="frame">
        <img src="${it.poster}" alt="" decoding="async">
        <video muted playsinline loop preload="none" aria-hidden="true"></video>
        <span class="badge">הזמנה מוקדמת</span>
      </div>
      <div class="card-meta">
        <div><p class="card-name">${esc(it.name)}</p><span class="card-sub">${esc(it.color)}</span></div>
        <span class="card-price price" dir="ltr">${money(it.price)}</span>
      </div>`;
    grid.appendChild(el);
    const c = { it, el, video: $("video", el), frame: $(".frame", el), playing: false };
    el.addEventListener("click", () => openProduct(it, el));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openProduct(it, el); } });
    c.video.addEventListener("playing", () => { if (c.playing) el.classList.add("is-walking"); });
    return c;
  });

  function load(c) { if (!c.video.getAttribute("src")) { c.video.src = c.it.video; c.video.preload = "auto"; } }
  function play(c) { load(c); c.playing = true; const p = c.video.play(); if (p && p.catch) p.catch(() => {}); }
  function stop(c) {
    c.playing = false; c.el.classList.remove("is-walking"); c.video.pause();
    setTimeout(() => { if (!c.playing) { try { c.video.currentTime = 0; } catch (e) {} } }, 380);
  }
  const hasIO = "IntersectionObserver" in window;
  if (hasIO && !saveData) {
    const pre = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { load(cards.find(c => c.el === e.target)); pre.unobserve(e.target); }
    }), { rootMargin: "60% 0px" });
    cards.forEach(c => pre.observe(c.el));
  }
  if (canHover) {
    cards.forEach(c => {
      c.el.addEventListener("pointerenter", () => play(c));
      c.el.addEventListener("pointerleave", () => stop(c));
      c.el.addEventListener("focus", () => play(c));
      c.el.addEventListener("blur", () => stop(c));
    });
  } else if (hasIO && !reduce) {
    const center = new IntersectionObserver(es => es.forEach(e => {
      const c = cards.find(x => x.frame === e.target);
      e.isIntersecting ? play(c) : stop(c);
    }), { rootMargin: "-35% 0px -35% 0px" });
    cards.forEach(c => center.observe(c.frame));
  }

  /* ---- drawers ---- */
  const scrim = $("#scrim");
  let openEl = null, opener = null;
  function openDrawer(el, from) {
    if (openEl) openEl.hidden = true;
    openEl = el; opener = from || opener;
    scrim.hidden = false; el.hidden = false;
    document.documentElement.style.overflow = "hidden";
    const f = $("[data-close]", el); if (f) f.focus();
  }
  function closeDrawer() {
    if (!openEl) return;
    const v = $("video", openEl); if (v) v.pause();
    openEl.hidden = true; scrim.hidden = true; openEl = null;
    document.documentElement.style.overflow = "";
    if (opener && document.contains(opener)) opener.focus();
  }
  scrim.addEventListener("click", closeDrawer);
  $$("[data-close]").forEach(b => b.addEventListener("click", closeDrawer));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

  /* ---- product drawer ---- */
  let current = null;
  $("#p-sizes").innerHTML = CONFIG.sizes.map(s =>
    `<label><input type="radio" name="p-size" id="p-size-${s}" value="${s}"><span>${s}</span></label>`).join("");
  $("#p-sizes").addEventListener("change", () => { $("#p-err").hidden = true; });
  function openProduct(it, from) {
    current = it;
    $("#p-name").textContent = it.name;
    $("#p-price").textContent = money(it.price);
    $("#p-color").textContent = it.color;
    $("#p-desc").textContent = it.desc;
    $("#p-details").innerHTML = it.details.map(d => `<li>${esc(d)}</li>`).join("");
    $$('input[name="p-size"]').forEach(r => r.checked = false);
    $("#p-err").hidden = true;
    $("#p-add").textContent = "הוספה לסל";
    const m = $("#p-media");
    m.innerHTML = `<img src="${it.poster}" alt="${esc(it.name)}"><video muted playsinline loop aria-hidden="true"></video>`;
    openDrawer($("#product"), from);
    if (!reduce) { const v = $("video", m); v.src = it.video; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  }
  $("#p-add").addEventListener("click", () => {
    const r = $('input[name="p-size"]:checked');
    if (!r) { $("#p-err").hidden = false; const f = $('input[name="p-size"]'); if (f) f.focus(); return; }
    add(current.id, r.value);
    openBag();
  });

  /* ---- bag ---- */
  let bag = [];
  try { bag = JSON.parse(localStorage.getItem("bag") || "[]").filter(l => byId(l.id)); } catch (e) { bag = []; }
  function save() { try { localStorage.setItem("bag", JSON.stringify(bag)); } catch (e) {} }
  function add(id, size) {
    const l = bag.find(x => x.id === id && x.size === size);
    if (l) l.qty++; else bag.push({ id, size, qty: 1 });
    save(); renderBag();
  }
  function total() { return bag.reduce((s, l) => s + byId(l.id).price * l.qty, 0); }
  function orderText() {
    const lines = bag.map(l => { const it = byId(l.id); return `• ${it.name} (${it.color}) · מידה ${l.size} · ×${l.qty} · ${money(it.price * l.qty)}`; });
    const nm = $("#o-name").value.trim();
    return `היי! הזמנה מוקדמת מ-${CONFIG.brand}:\n${lines.join("\n")}\nסה״כ: ${money(total())}` + (nm ? `\nשם: ${nm}` : "");
  }
  function renderBag() {
    const count = bag.reduce((s, l) => s + l.qty, 0);
    $("#bag-count").textContent = count;
    const box = $("#bag-lines");
    if (!bag.length) {
      box.innerHTML = `<p class="empty">הסל ריק.</p><a class="btn ghost" href="#shop" data-close-link>לקולקציה</a>`;
      $("[data-close-link]", box).addEventListener("click", closeDrawer);
      $("#bag-foot").hidden = true;
      return;
    }
    $("#bag-foot").hidden = false;
    box.innerHTML = bag.map((l, i) => {
      const it = byId(l.id);
      return `<div class="line">
        <div class="thumb"><img src="${it.poster}" alt=""></div>
        <div class="line-info">
          <div class="line-top"><b>${esc(it.name)}</b><span class="price" dir="ltr">${money(it.price * l.qty)}</span></div>
          <span class="line-sub">${esc(it.color)} · מידה ${l.size}</span>
          <div class="qty">
            <button type="button" data-q="${i}" data-d="1" aria-label="עוד אחד">+</button>
            <output>${l.qty}</output>
            <button type="button" data-q="${i}" data-d="-1" aria-label="אחד פחות">−</button>
            <button type="button" class="rm" data-rm="${i}">הסרה</button>
          </div>
        </div>
      </div>`;
    }).join("");
    $("#bag-total").textContent = money(total());
    refreshSend();
  }
  function refreshSend() {
    const send = $("#o-send");
    send.href = CONFIG.whatsapp ? "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(orderText()) : "#";
    send.setAttribute("aria-disabled", CONFIG.whatsapp ? "false" : "true");
  }
  $("#bag-lines").addEventListener("click", e => {
    const q = e.target.closest("[data-q]"), rm = e.target.closest("[data-rm]");
    if (q) { const l = bag[+q.dataset.q]; l.qty += +q.dataset.d; if (l.qty < 1) bag.splice(+q.dataset.q, 1); }
    else if (rm) bag.splice(+rm.dataset.rm, 1);
    else return;
    save(); renderBag();
  });
  $("#o-name").addEventListener("input", refreshSend);
  $("#o-send").addEventListener("click", e => {
    const err = $("#o-err");
    if (!CONFIG.whatsapp) { e.preventDefault(); err.textContent = "מצב תצוגה: עוד אין מספר וואטסאפ בהגדרות."; err.hidden = false; return; }
    err.hidden = true;
  });
  function openBag(from) { renderBag(); openDrawer($("#bag"), from); }
  $("#bag-open").addEventListener("click", e => openBag(e.currentTarget));
  renderBag();
})();
</script>
</body>
</html>
